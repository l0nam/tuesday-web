# Локальная MariaDB для разработки сайта Tuesday.
#   docker compose up -d        - запустить
#   docker compose down         - остановить (данные сохраняются)
#   docker compose down -v      - остановить и удалить данные (init-скрипт выполнится заново)
#
# Порты привязаны к 127.0.0.1, поэтому снаружи (из сети) база недоступна.
services:
  mariadb:
    image: mariadb:10.11
    container_name: tuesday-mariadb
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: root_pass
      TZ: UTC
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - tuesday-mariadb-data:/var/lib/mysql
      - ./docker/mariadb/init:/docker-entrypoint-initdb.d:ro
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Веб-интерфейс для просмотра таблиц: http://localhost:8080
  # Сервер: mariadb, пользователь: root, пароль: root_pass
  adminer:
    image: adminer:latest
    container_name: tuesday-adminer
    restart: unless-stopped
    depends_on:
      mariadb:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"

volumes:
  tuesday-mariadb-data:
